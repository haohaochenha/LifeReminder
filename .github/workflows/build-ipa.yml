name: Build unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -project LifeReminder.xcodeproj -list

      - name: Build app
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project LifeReminder.xcodeproj \
            -scheme LifeReminder \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            echo "---- build failed, last 200 lines ----"
            tail -n 200 build.log
            exit 1
          fi

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "app: $APP_PATH"
          PLIST="$APP_PATH/Info.plist"
          if /usr/libexec/PlistBuddy -c "Print :CADisableMinimumFrameDurationOnPhone" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :CADisableMinimumFrameDurationOnPhone true" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :CADisableMinimumFrameDurationOnPhone bool true" "$PLIST"
          fi
          /usr/libexec/PlistBuddy -c "Print :CADisableMinimumFrameDurationOnPhone" "$PLIST"
          rm -rf Payload LifeReminder.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry LifeReminder.ipa Payload
          ls -lh LifeReminder.ipa

      - name: Publish IPA to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 生活提醒 v1.0.${{ github.run_number }}
          body: 自动构建的未签名 IPA，可直接用 TrollStore 安装。
          files: LifeReminder.ipa
